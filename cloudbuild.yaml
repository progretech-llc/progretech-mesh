steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/progretech-mesh:$COMMIT_SHA
      - .

  - name: node:24-slim
    entrypoint: sh
    args:
      - -c
      - node --test openclaw-plugin-progretech-mesh/*.test.js

  # Exercise the exact image before publishing it: cloud releases must retain
  # gateway receipt restoration, not just the separate desktop release branch.
  - name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - -e
      - APP_ENV=testing
      - -e
      - DEV_SEED_AGENTS=0
      - us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/progretech-mesh:$COMMIT_SHA
      - python
      - -m
      - unittest
      - discover
      - -s
      - tests
      - -p
      - test_gateway*.py

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/progretech-mesh:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - progretech-mesh
      - --image=us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/progretech-mesh:$COMMIT_SHA
      - --update-env-vars=BUILD_ID=$COMMIT_SHA,MESH_VERSION=1.18.3-e2e-stability,MESH_AUTH_MODE=progretech-shared,PROGRETECH_SECURITY_ENFORCED=1
      - --update-secrets=PROGRETECH_SECURITY_STATUS_TOKEN=progretech-security-status-token:latest
      - --region=us-east1
      - --project=$PROJECT_ID
      - --max-instances=1
      - --timeout=3600
      - --quiet

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - services
      - update-traffic
      - progretech-mesh
      - --to-latest
      - --region=us-east1
      - --project=$PROJECT_ID
      - --quiet

images:
  - us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/progretech-mesh:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
