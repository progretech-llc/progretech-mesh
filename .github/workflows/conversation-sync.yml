name: Conversation adapter contracts
on:
  push:
    paths: ['conversation_sync/**', '.github/workflows/conversation-sync.yml']
  pull_request:
    paths: ['conversation_sync/**', '.github/workflows/conversation-sync.yml']
permissions:
  contents: read
jobs:
  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'openhands-sdk==1.49.6' 'Pillow>=10,<13'
      - run: python -m unittest discover -s conversation_sync -p 'test_*.py'
        env:
          OPENHANDS_SUPPRESS_BANNER: '1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test conversation_sync/*.test.js
