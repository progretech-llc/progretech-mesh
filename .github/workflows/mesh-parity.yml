name: Hosted and local Mesh contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prevent shipping an older desktop feature baseline
        if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        run: git merge-base --is-ancestor origin/releases/mesh-local HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test openclaw-plugin-progretech-mesh/*.test.js tests/*.mjs
